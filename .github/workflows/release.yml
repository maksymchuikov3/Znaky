name: Release APK

# Every push to main publishes a new APK on the Releases page.
# A pushed tag like v0.2.0 publishes that exact version.
# "Run workflow" on the Actions tab does the same by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: ver
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZNAKY_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZNAKY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No ZNAKY_KEYSTORE_BASE64 secret: signing with the shared app/debug.keystore."
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release APK
        env:
          ZNAKY_KEYSTORE_PASSWORD: ${{ secrets.ZNAKY_KEYSTORE_PASSWORD }}
          ZNAKY_KEY_ALIAS: ${{ secrets.ZNAKY_KEY_ALIAS }}
          ZNAKY_KEY_PASSWORD: ${{ secrets.ZNAKY_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}
          cp app/build/outputs/apk/release/*.apk "rushai-${{ steps.ver.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Rushai ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Завантажте `rushai-${{ steps.ver.outputs.name }}.apk` нижче і відкрийте його на телефоні.
            Нова версія встановлюється поверх попередньої, дані зберігаються.
          prerelease: false
          make_latest: true
          files: rushai-${{ steps.ver.outputs.name }}.apk
